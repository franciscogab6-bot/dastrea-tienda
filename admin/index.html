<!doctype html>
<html lang="es" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administrador · D’Astrea</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Grenze+Gotisch:wght@700..900&family=Instrument+Sans:wght@400..600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login" id="login">
  <form class="lbox" id="loginForm">
    <img src="../assets/logo-blanco.svg" alt="D’Astrea" width="120" height="88">
    <h1>Administrador</h1>
    <p id="loginMsg">Escribe la contraseña de la tienda.</p>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <button class="btn pri" type="submit">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <button class="ib menu" id="menuBtn" aria-label="Menú" data-icon="Menú"></button>
    <img src="../assets/logo-blanco.svg" alt="D’Astrea" class="lg">
    <span class="mode" id="mode"></span>
    <div class="sp"></div>
    <span class="dirty" id="dirty" hidden>Cambios sin guardar</span>
    <a class="btn ghost hide-s" href="../" target="_blank" rel="noopener"><span data-icon="Ver"></span> Ver tienda</a>
    <button class="btn pri" id="saveBtn" disabled><span data-icon="Listo"></span> <span class="t">Guardar</span></button>
  </header>
  <nav class="side" id="side">
    <button data-tab="productos" class="on"><span data-icon="Búho"></span>Productos</button>
    <button data-tab="colecciones"><span data-icon="Lista"></span>Colecciones</button>
    <button data-tab="prendas"><span data-icon="Precio"></span>Prendas y precios</button>
    <button data-tab="colores"><span data-icon="Imagen"></span>Colores</button>
    <button data-tab="portada"><span data-icon="Nuevo"></span>Portada y temporada</button>
    <button data-tab="contacto"><span data-icon="Chat"></span>Contacto y envíos</button>
    <button data-tab="legal"><span data-icon="Candado"></span>Políticas</button>
    <button data-tab="listas"><span data-icon="Regalo"></span>Listas de regalo</button>
    <button data-tab="espera"><span data-icon="Correo"></span>Lista de espera</button>
    <button data-tab="respaldo"><span data-icon="Copiar"></span>Respaldos</button>
    <button data-logout class="out"><span data-icon="Cerrar"></span>Salir</button>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="drawer" id="editor" aria-hidden="true"><div class="ed" id="edBody"></div></div>
<div class="ov" id="ov"></div>
<div class="toast" id="toast"></div>

<script src="../assets/iconos.js"></script>
<script src="../data/catalog.js"></script>
<script src="../assets/core.js"></script>
<script src="admin.js"></script>
</body>
</html>
